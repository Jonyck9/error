<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 Not Found</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: Segoe UI, sans-serif;
		}

		body {
			background: #0d1117;
			color: #f0f6fc;
		}

		.container {
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.error-page {
			text-align: center;
			max-width: 700px;
		}

		.error-code {
			font-size: 120px;
			font-weight: bold;
			color: #58a6ff;
		}

		.title {
			font-size: 32px;
			margin: 15px 0;
		}

		.description {
			color: #8b949e;
			margin-bottom: 30px;
		}

		.info-box {
			background: #161b22;
			border: 1px solid #30363d;
			border-radius: 10px;
			padding: 20px;
			margin-bottom: 20px;
		}

		button {
			background: #238636;
			color: white;
			border: none;
			padding: 12px 24px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
		}

		button:hover {
			background: #2ea043;
		}

		#pdfViewer {
			display: none;
			width: 100%;
			height: 100vh;
		}

		iframe {
			width: 100%;
			height: 100%;
			border: none;
		}
	</style>
</head>

<body>

	<div class="container" id="errorPage">
		<div class="error-page">

			<div class="error-code" onclick="showPDF()">404</div>

			<h1 class="title">Page Not Found</h1>

			<p class="description">
				The page you are looking for doesn't exist.
			</p>

			<div class="info-box">
				Server Status: Online
			</div>

		</div>
	</div>

	<div id="pdfViewer">

		<!-- ВСТАВЬ СЮДА ИМЯ ИЛИ ССЫЛКУ НА PDF -->
		<!-- Например: src="mybook.pdf" -->
		<!-- Или: src="https://site.com/file.pdf" -->

		<iframe src="mybook.pdf"></iframe>

	</div>

	<script>
		function showPDF() {
			document.getElementById("errorPage").style.display = "none"
			document.getElementById("pdfViewer").style.display = "block"
		}
	</script>

</body>

</html>
